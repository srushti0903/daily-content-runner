name: Producer

# Nothing here posts: the laptop's finished story goes into the posting buffer through
# data/inbox (job flow), and the tick (tick.yml) posts it at 08:00 and 20:00 IST.
# 2026-11-05: the free-pipeline "fill" runs are gone - their videos had not posted since 10-28.
on:
  schedule:
    # UTC. IST = UTC + 5:30.
    - cron: '0 4 * * *'     # 09:30 IST - analytics + title tests + comment replies
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        required: true
        default: summary
        type: choice
        options: [summary, flow]
      item:
        description: For flow - the pool script id the laptop made in Google Flow
        required: false
        default: ''

concurrency:
  group: producer
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  LT_ROLE: producer
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "job=summary" >> "$GITHUB_OUTPUT"
          fi

      - name: Credentials and state
        env:
          DOTENV: ${{ secrets.DOTENV }}
          BRAND_JSON: ${{ secrets.BRAND_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: |
          umask 077
          printf '%s\n' "$DOTENV" > .env
          printf '%s' "$YT_TOKEN_JSON" > token.json
          printf '%s' "$YT_CLIENT_SECRET_JSON" > client_secret_github.json
          python3 .github/mask_secrets.py
          python3 .github/brand.py apply
          git config --global user.name content-bot
          git config --global user.email bot@users.noreply.github.com
          python3 src/state_sync.py pull

      # A static ffmpeg kept in the Actions cache: `apt-get update` once hung for 17 minutes.
      - name: Restore ffmpeg
        uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-v1

      - name: Get ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          mkdir -p ~/ffmpeg-bin
          if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            tar -xJf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe ~/ffmpeg-bin/
          else
            sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg && cp "$(which ffmpeg)" "$(which ffprobe)" ~/ffmpeg-bin/
          fi

      - name: Put ffmpeg on the path
        run: |
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-bin/ffmpeg" -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python packages
        timeout-minutes: 15
        run: |
          pip install -q --retries 5 --timeout 60 -r requirements.txt

      - name: Run
        timeout-minutes: 60
        env:
          FLOW_ITEM: ${{ inputs.item }}
        run: |
          case "${{ steps.pick.outputs.job }}" in
            flow)    python src/vault.py run flow -- python src/flow_build.py "$FLOW_ITEM" ;;
            summary) python src/vault.py run summary -- bash -c 'python src/analytics.py; python src/meta_insights.py; python src/experiments.py --tick; python src/engage.py; true' ;;
          esac

      - name: Save state
        if: always()
        env:
          BRAND_JSON: ${{ secrets.BRAND_JSON }}
        run: python3 src/state_sync.py push "${{ steps.pick.outputs.job || 'producer' }} ${{ github.run_id }}"

      - name: Tell the owner if this run broke
        if: failure()
        run: |
          python3 src/alert.py "FAILED: cloud ${{ steps.pick.outputs.job || 'producer' }} run - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Remove credentials
        if: always()
        run: rm -f .env token.json client_secret_*.json
